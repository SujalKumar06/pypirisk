global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: model-server
    static_configs:
      - targets: ["model-server:8080"]

  - job_name: ray-serve
    static_configs:
      - targets: ["ray-serve:8000"]

  - job_name: frontend
    static_configs:
      - targets: ["frontend:9101"]

  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]

  - job_name: seaweedfs
    static_configs:
      - targets: ["seaweedfs:9324"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
