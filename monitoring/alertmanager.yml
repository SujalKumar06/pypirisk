# Alerts are grouped and shown in the Alertmanager UI (http://localhost:9093), as in the
# course's sample configuration. To also notify someone, add a webhook (e.g. a
# webhook.site URL, like the course sample) or an email receiver under `receivers`.
route:
  receiver: ui-only
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ui-only
