# Alert rules, evaluated by Prometheus and sent to Alertmanager.

groups:
  - name: service-health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not scraped {{ $labels.instance }} for over a minute."

  - name: api
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{service="api", status=~"5.."}[5m]))
            / sum(rate(http_requests_total{service="api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API 5xx ratio above 5%"
          description: "{{ $value | humanizePercentage }} of API requests failed over 5 minutes."

      - alert: ApiSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{service="api"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 1 s"
          description: "95th percentile API latency is {{ $value | humanizeDuration }}."

  - name: model
    rules:
      - alert: FeatureDriftDetected
        # Threshold calibrated on the pilot run: natural drift peaked at 0.34 (see params.yaml).
        expr: max(pypirisk_feature_drift) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Serving features drifted from the training data"
          description: "A feature mean moved {{ $value | printf \"%.2f\" }} standard deviations (threshold 1)."

  - name: host
    rules:
      - alert: HostLowDiskSpace
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem below 10% free"
          description: "Only {{ $value | humanizePercentage }} of / is free on {{ $labels.instance }}."
